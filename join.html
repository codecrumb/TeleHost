<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TeleHost – Download</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px 64px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 40px;
    }
    h1 a { color: #fff; text-decoration: none; }

    .card {
      width: 100%;
      max-width: 640px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 40px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      text-align: center;
    }

    /* ── Status icon ── */
    .icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: #14202f; color: #4a9eff;
      flex-shrink: 0;
    }
    .icon svg { display: none; }
    .card[data-state="loading"] .icon .i-load,
    .card[data-state="done"] .icon .i-done,
    .card[data-state="error"] .icon .i-error { display: block; }
    .card[data-state="done"] .icon { background: #12261a; color: #4ade80; }
    .card[data-state="error"] .icon { background: #2a1616; color: #ff6b6b; }
    .i-load { animation: spin 1.1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .i-load { animation: none; } }

    /* ── File info ── */
    .name {
      color: #fff;
      font-size: 1.25rem;
      font-weight: 600;
      word-break: break-word;
      max-width: 100%;
    }
    .meta { color: #777; font-size: 0.85rem; margin-top: 6px; min-height: 1.2em; }
    .status { color: #aaa; font-size: 0.95rem; }
    .status.error { color: #ff6b6b; }

    /* ── Progress ── */
    .progress { width: 100%; display: flex; flex-direction: column; gap: 8px; }
    .bar { height: 8px; background: #2a2a2a; border-radius: 4px; overflow: hidden; }
    .bar > div { height: 100%; width: 0; background: #4a9eff; border-radius: 4px; transition: width 0.15s; }
    .card[data-state="done"] .bar > div { background: #4ade80; }
    .card[data-state="error"] .bar > div { background: #ff6b6b; }
    .progress-text { display: flex; justify-content: space-between; color: #777; font-size: 0.8rem; }

    /* ── Buttons ── */
    .btn {
      padding: 12px 32px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      background: #fff;
      color: #000;
      cursor: pointer;
      transition: background 0.12s, transform 0.05s;
    }
    .btn:hover { background: #e8e8e8; }
    .btn:active { transform: scale(0.98); }
    .btn:focus-visible, summary:focus-visible, .mini:focus-visible { outline: 2px solid #4a9eff; outline-offset: 2px; }

    /* ── Manual section ── */
    details { width: 100%; text-align: left; border-top: 1px solid #2a2a2a; padding-top: 18px; }
    summary { cursor: pointer; color: #888; font-size: 0.85rem; user-select: none; }
    summary:hover { color: #bbb; }
    .manual { margin-top: 16px; display: flex; flex-direction: column; gap: 18px; }
    .manual h3 { font-size: 0.75rem; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }

    .part {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 9px 12px; background: #111; border-radius: 8px; font-size: 0.85rem; color: #bbb;
    }
    .part + .part { margin-top: 6px; }
    .part a { color: #4a9eff; text-decoration: none; font-weight: 500; white-space: nowrap; }
    .part a:hover { text-decoration: underline; }
    .part .size { color: #666; margin-left: 8px; }

    .cmd { position: relative; background: #111; border-radius: 8px; padding: 12px 70px 12px 14px; }
    .cmd code {
      display: block; color: #bbb; font-size: 0.8rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap; word-break: break-all;
    }
    .cmd-label { color: #666; font-size: 0.75rem; margin-bottom: 6px; }
    .mini {
      position: absolute; top: 8px; right: 8px;
      padding: 4px 10px; font-size: 0.75rem; border: 1px solid #333; border-radius: 6px;
      background: #1a1a1a; color: #aaa; cursor: pointer;
    }
    .mini:hover { color: #fff; border-color: #555; }

    .hidden { display: none !important; }

    @media (max-width: 480px) {
      body { padding-top: 32px; }
      h1 { margin-bottom: 28px; }
      .card { padding: 32px 20px; }
    }
  </style>
</head>
<body>
  <h1><a href="/">TeleHost</a></h1>

  <main class="card" id="card" data-state="loading">
    <div class="icon" aria-hidden="true">
      <svg class="i-load" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.2-8.55"/></svg>
      <svg class="i-done" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      <svg class="i-error" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.01"/></svg>
    </div>

    <div>
      <div class="name" id="name">Loading…</div>
      <div class="meta" id="meta"></div>
    </div>

    <div class="status" id="status" aria-live="polite"></div>

    <div class="progress" id="progress">
      <div class="bar"><div id="fill"></div></div>
      <div class="progress-text"><span id="progressLeft"></span><span id="progressRight"></span></div>
    </div>

    <button id="again" class="btn hidden" type="button">Download</button>

    <details id="manual" class="hidden">
      <summary>Download the parts manually</summary>
      <div class="manual" id="manualBody"></div>
    </details>
  </main>

  <script>
    (function () {
      var card = document.getElementById('card');
      var nameEl = document.getElementById('name');
      var metaEl = document.getElementById('meta');
      var statusEl = document.getElementById('status');
      var fillEl = document.getElementById('fill');
      var progressLeft = document.getElementById('progressLeft');
      var progressRight = document.getElementById('progressRight');
      var againBtn = document.getElementById('again');
      var manualEl = document.getElementById('manual');
      var manualBody = document.getElementById('manualBody');
      var savedBlob = null, savedName = '';

      function setState(s) { card.setAttribute('data-state', s); }

      function fmt(n) {
        if (n < 1024) return n + ' B';
        var u = ['KB', 'MB', 'GB'], i = -1;
        do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
        return n.toFixed(n >= 100 ? 0 : 1) + ' ' + u[i];
      }

      function fail(msg) {
        setState('error');
        statusEl.textContent = msg;
        statusEl.classList.add('error');
      }

      // Only same-origin /file/ paths are allowed, so a crafted link can't make
      // this page fetch from somewhere else.
      function isFilePath(p) {
        return typeof p === 'string' && /^\/file\/[A-Za-z0-9_.\-]+$/.test(p);
      }

      function save() {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(savedBlob);
        a.download = savedName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 60000);
      }

      againBtn.addEventListener('click', save);

      // Read a response body as a stream so the bar moves smoothly within a part.
      async function readBlob(res, onBytes) {
        if (!res.body || !res.body.getReader) {
          var b = await res.blob();
          onBytes(b.size);
          return b;
        }
        var reader = res.body.getReader(), chunks = [];
        for (;;) {
          var r = await reader.read();
          if (r.done) break;
          chunks.push(r.value);
          onBytes(r.value.length);
        }
        return new Blob(chunks);
      }

      async function fetchPart(url, tries, onBytes) {
        var last;
        for (var i = 0; i < tries; i++) {
          var got = 0;
          try {
            var res = await fetch(url);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return await readBlob(res, function (n) { got += n; onBytes(n); });
          } catch (e) {
            last = e;
            onBytes(-got); // roll back this attempt's progress
            await new Promise(function (r) { setTimeout(r, 800 * (i + 1)); });
          }
        }
        throw last;
      }

      async function fetchJson(url, tries) {
        var last;
        for (var i = 0; i < tries; i++) {
          try {
            var res = await fetch(url);
            if (res.ok) return await res.json();
            last = new Error('HTTP ' + res.status);
          } catch (e) { last = e; }
          await new Promise(function (r) { setTimeout(r, 800 * (i + 1)); });
        }
        throw last;
      }

      async function run() {
        // Link shape: /join/<manifestId>, e.g. /join/AgACAg....json
        var id = decodeURIComponent(location.pathname.split('/')[2] || '');
        var m = '/file/' + id;
        if (!isFilePath(m) || !/\.json$/.test(id)) return fail('Invalid or missing download link.');

        var manifest;
        try {
          manifest = await fetchJson(m, 3);
        } catch (e) {
          return fail('Could not load the file list. The link may be broken.');
        }
        if (!manifest || manifest.v !== 1 || !Array.isArray(manifest.parts) || !manifest.parts.length ||
            !manifest.parts.every(function (p) { return isFilePath(p.src); })) {
          return fail('This link is not a valid multi-part file.');
        }

        savedName = String(manifest.name || 'download').replace(/[\\/:*?"<>|\r\n]/g, '_');
        nameEl.textContent = savedName;
        document.title = savedName + ' – TeleHost';

        var total = manifest.parts.length;
        var expected = manifest.size || manifest.parts.reduce(function (s, p) { return s + (p.size || 0); }, 0);
        metaEl.textContent = (expected ? fmt(expected) + ' · ' : '') + total + (total === 1 ? ' part' : ' parts');

        var blobs = [], loaded = 0;
        function onBytes(n) {
          loaded += n;
          if (expected) {
            fillEl.style.width = Math.min(100, Math.max(0, loaded / expected * 100)) + '%';
            progressRight.textContent = fmt(Math.max(0, loaded)) + ' of ' + fmt(expected);
          }
        }

        for (var i = 0; i < total; i++) {
          statusEl.textContent = 'Combining part ' + (i + 1) + ' of ' + total + '…';
          progressLeft.textContent = 'Part ' + (i + 1) + ' of ' + total;
          var blob;
          try {
            blob = await fetchPart(manifest.parts[i].src, 3, onBytes);
          } catch (e) {
            showManual(manifest);
            return fail('Part ' + (i + 1) + ' of ' + total + ' could not be downloaded.');
          }
          if (manifest.parts[i].size && blob.size !== manifest.parts[i].size) {
            showManual(manifest);
            return fail('Part ' + (i + 1) + ' of ' + total + ' has the wrong size.');
          }
          blobs.push(blob);
        }

        if (manifest.size && loaded !== manifest.size) {
          showManual(manifest);
          return fail('The combined file has the wrong size.');
        }

        savedBlob = new Blob(blobs, { type: manifest.type || 'application/octet-stream' });
        fillEl.style.width = '100%';
        progressLeft.textContent = 'Complete';
        setState('done');
        statusEl.textContent = 'Ready — your download should start automatically.';
        againBtn.classList.remove('hidden');
        showManual(manifest);
        save();
      }

      function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
      }

      function cmdBlock(label, text) {
        var wrap = el('div');
        wrap.appendChild(el('div', 'cmd-label', label));
        var box = el('div', 'cmd');
        box.appendChild(el('code', '', text));
        var copy = el('button', 'mini', 'Copy');
        copy.type = 'button';
        copy.addEventListener('click', function () {
          navigator.clipboard.writeText(text).then(function () {
            copy.textContent = 'Copied!';
            setTimeout(function () { copy.textContent = 'Copy'; }, 2000);
          }).catch(function () {});
        });
        box.appendChild(copy);
        wrap.appendChild(box);
        return wrap;
      }

      function showManual(manifest) {
        manualBody.textContent = '';
        var total = manifest.parts.length;
        var pad = String(total).length;
        var base = savedName;

        // Each part is saved as "<name>.partNN" via the download attribute.
        var names = manifest.parts.map(function (p, i) {
          return base + '.part' + String(i + 1).padStart(pad, '0');
        });

        var partsSection = el('div');
        partsSection.appendChild(el('h3', '', 'Parts'));
        manifest.parts.forEach(function (p, i) {
          var row = el('div', 'part');
          var left = el('span', '', 'Part ' + (i + 1));
          if (p.size) left.appendChild(el('span', 'size', fmt(p.size)));
          var a = el('a', '', 'Download');
          a.href = p.src;
          a.download = names[i];
          row.appendChild(left);
          row.appendChild(a);
          partsSection.appendChild(row);
        });
        manualBody.appendChild(partsSection);

        var joinSection = el('div');
        joinSection.appendChild(el('h3', '', 'Join them'));
        var mac = cmdBlock('macOS / Linux',
          'cat ' + names.map(function (n) { return '"' + n + '"'; }).join(' ') + ' > "' + base + '"');
        mac.style.marginBottom = '10px';
        joinSection.appendChild(mac);
        joinSection.appendChild(cmdBlock('Windows (cmd)',
          'copy /b ' + names.map(function (n) { return '"' + n + '"'; }).join('+') + ' "' + base + '"'));
        manualBody.appendChild(joinSection);

        manualEl.classList.remove('hidden');
      }

      run();
    })();
  </script>
</body>
</html>
