<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TeleHost</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0d0d0d">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px 64px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
      margin-bottom: 40px;
      user-select: none;
    }

    /* ── Drop zone card ── */
    #dropzone {
      width: 100%;
      max-width: 560px;
      min-height: 300px;
      background: #1a1a1a;
      border: 2px dashed #333;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 40px 32px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
    }

    #dropzone.drag-over {
      border-color: #4a9eff;
      background: #141c28;
    }

    #dropzone:focus-visible {
      outline: 2px solid #4a9eff;
      outline-offset: 2px;
    }

    /* ── Idle state ── */
    .idle-icon {
      color: #555;
      flex-shrink: 0;
    }

    .idle-text {
      text-align: center;
      color: #888;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .idle-text strong {
      display: block;
      color: #bbb;
      font-size: 1.05rem;
      margin-bottom: 4px;
    }

    /* ── Segmented control ── */
    .seg-ctrl {
      display: flex;
      border: 1px solid #444;
      border-radius: 8px;
      overflow: hidden;
      background: transparent;
      flex-shrink: 0;
    }

    .seg {
      flex: 1;
      padding: 8px 22px;
      font-size: 0.85rem;
      font-weight: 500;
      border: none;
      background: transparent;
      color: #888;
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
      white-space: nowrap;
      letter-spacing: 0.01em;
    }

    .seg:first-child {
      border-right: 1px solid #444;
    }

    .seg.active {
      background: #fff;
      color: #000;
    }

    .seg:not(.active):hover {
      background: #252525;
      color: #ccc;
    }

    /* ── Options (collapsed by default) ── */
    .opts {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .opts-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
    }

    .opts-toggle {
      font-size: 0.8rem;
      color: #777;
      text-decoration: none;
    }

    .opts-toggle:hover,
    .opts-toggle:focus-visible {
      color: #ccc;
    }

    .opts-toggle::after {
      content: ' \25BE';
    }

    .opts-toggle[aria-expanded="true"]::after {
      content: ' \25B4';
    }

    .opts-summary {
      color: #4a9eff;
    }

    .opts-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .opts-panel[hidden] {
      display: none;
    }

    /* ── Link expiry ── */
    .expiry {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: #888;
    }

    .expiry select {
      background: transparent;
      color: #ccc;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .expiry select option {
      background: #1a1a1a;
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 16px;
    }

    .pw {
      background: transparent;
      color: #ccc;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.8rem;
      width: 150px;
    }

    .pw::placeholder {
      color: #666;
    }

    /* ── Hint text ── */
    #hint {
      font-size: 0.78rem;
      color: #666;
      text-align: center;
      min-height: 1em;
      transition: opacity 0.2s;
    }

    #hint.hidden {
      visibility: hidden;
    }

    /* ── Uploading state ── */
    #state-uploading {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #333;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .uploading-label {
      font-size: 0.9rem;
      color: #888;
      max-width: 400px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
    }

    /* ── Error state ── */
    #state-error {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .error-icon { color: #e05252; }

    .error-msg {
      font-size: 0.9rem;
      color: #e05252;
      text-align: center;
    }

    /* ── Results list ── */
    #results {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }

    /* ── Upload history ── */
    #history {
      width: 100%;
      max-width: 560px;
      margin-top: 28px;
      display: none;
    }

    #history.visible { display: block; }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    #historyClear {
      background: none;
      border: none;
      color: #666;
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
      padding: 2px 6px;
    }

    #historyClear:hover { color: #fff; }

    #historyList {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #historyList .result-item { padding: 8px 12px; }

    .result-item {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .result-url-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .result-url {
      font-size: 0.82rem;
      color: #9ac8ff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-decoration: none;
    }

    .result-url:hover { text-decoration: underline; }

    .result-url-original {
      font-size: 0.72rem;
      color: #555;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .copy-btn {
      flex-shrink: 0;
      background: transparent;
      border: 1px solid #444;
      border-radius: 6px;
      color: #aaa;
      font-size: 0.75rem;
      padding: 4px 10px;
      cursor: pointer;
      transition: border-color 0.12s, color 0.12s;
      white-space: nowrap;
    }

    .copy-btn:hover { border-color: #aaa; color: #fff; }
    .copy-btn.copied { border-color: #4caf50; color: #4caf50; }

    /* hidden file input */
    #fileInput, #folderInput { display: none; }

    .inline-link {
      background: none;
      border: none;
      color: inherit;
      font: inherit;
      font-size: 0.95rem;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
    }

    /* retry link */
    .retry-link {
      font-size: 0.82rem;
      color: #666;
      cursor: pointer;
      text-decoration: underline;
      background: none;
      border: none;
      padding: 0;
    }

    .retry-link:hover { color: #aaa; }

    /* ── Error result items ── */
    .result-item-error {
      border-color: #3a1a1a;
      background: #1f1111;
    }

    .result-error-name {
      font-size: 0.82rem;
      color: #e05252;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .result-error-msg {
      font-size: 0.72rem;
      color: #a03030;
    }

    /* ── Fallback notice ── */
    .result-fallback-notice {
      font-size: 0.72rem;
      color: #c49a00;
    }


    /* ── Copy-as menu ── */
    details.more { position: relative; flex-shrink: 0; }
    details.more > summary {
      list-style: none; cursor: pointer; color: #777; font-size: 0.8rem; padding: 4px 6px;
      border: 1px solid #333; border-radius: 6px; user-select: none;
    }
    details.more > summary::-webkit-details-marker { display: none; }
    details.more > summary:hover, details.more[open] > summary { color: #fff; border-color: #777; }
    details.more > summary:focus-visible { outline: 2px solid #4a9eff; outline-offset: 2px; }
    .more-menu {
      position: absolute; right: 0; top: calc(100% + 4px); z-index: 20; min-width: 120px;
      background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 4px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column;
    }
    .more-menu button {
      background: none; border: none; color: #ccc; font: inherit; font-size: 0.78rem;
      text-align: left; padding: 6px 10px; border-radius: 5px; cursor: pointer;
    }
    .more-menu button:hover, .more-menu button:focus-visible { background: #2a2a2a; color: #fff; }

    /* ── History extras ── */
    .history-actions { display: flex; align-items: center; gap: 6px; }
    #historyCopyAll {
      background: none; border: none; color: #666; font: inherit; font-size: 0.75rem;
      letter-spacing: inherit; text-transform: inherit; cursor: pointer; padding: 2px 6px;
    }
    #historyCopyAll:hover { color: #fff; }
    #historyList { max-height: 420px; overflow-y: auto; }
    .result-note { font-size: 0.72rem; color: #8a7a3a; }
    .result-item.fresh { animation: fresh 1.6s ease-out; }
    @keyframes fresh { from { border-color: #4a9eff; background: #14202f; } }
    @media (prefers-reduced-motion: reduce) { .result-item.fresh { animation: none; } }

    /* ── Upload tray ── */
    .tray { position: fixed; right: 20px; bottom: 20px; width: 320px; z-index: 50; }
    .tray[hidden] { display: none; }
    .tray-card {
      position: relative; background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 12px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }
    .tray.stacked .tray-card::before, .tray.stacked .tray-card::after {
      content: ''; position: absolute; height: 100%; background: #1c1c1c;
      border: 1px solid #333; border-radius: 12px; z-index: -1;
    }
    .tray.stacked .tray-card::before { left: 9px; right: 9px; bottom: -7px; }
    .tray.stacked .tray-card::after { left: 18px; right: 18px; bottom: -14px; z-index: -2; background: #161616; }
    .tray.open .tray-card::before, .tray.open .tray-card::after { display: none; }
    .tray-head {
      position: relative; width: 100%; display: flex; align-items: center; gap: 10px;
      padding: 12px 14px 14px; background: none; border: none; color: #ddd; font: inherit;
      font-size: 0.85rem; cursor: pointer; text-align: left;
    }
    .tray-head:focus-visible, .job button:focus-visible { outline: 2px solid #4a9eff; outline-offset: 2px; }
    .tray-summary { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tray-pct { color: #888; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .tray-total { position: absolute; left: 14px; right: 14px; bottom: 6px; height: 3px; background: #2a2a2a; border-radius: 2px; overflow: hidden; }
    #trayFill { display: block; height: 100%; width: 0; background: #4a9eff; transition: width 0.15s; }
    .tray-list { display: none; max-height: min(50vh, 320px); overflow-y: auto; border-top: 1px solid #2a2a2a; }
    .tray.open .tray-list { display: block; }
    @media (hover: hover) and (pointer: fine) { .tray:hover .tray-list { display: block; } .tray:hover .tray-card::before, .tray:hover .tray-card::after { display: none; } }
    .job { padding: 10px 14px; display: grid; grid-template-columns: 1fr auto auto; gap: 2px 8px; align-items: center; }
    .job + .job { border-top: 1px solid #222; }
    .job-name { grid-column: 1; font-size: 0.82rem; color: #ddd; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .job-label { grid-column: 1; font-size: 0.72rem; color: #777; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .job[data-state="error"] .job-label { color: #e05252; white-space: normal; }
    .job[data-state="done"] .job-label { color: #4ade80; }
    .job button { background: none; border: none; color: #777; cursor: pointer; font: inherit; font-size: 0.78rem; padding: 2px 6px; }
    .job button:hover { color: #fff; }
    .job-x { grid-column: 3; grid-row: 1 / span 2; font-size: 1.1rem !important; }
    .job-retry { grid-column: 2; grid-row: 1 / span 2; }
    .job-retry[hidden], .job-x[hidden] { display: none; }
    .job-bar { grid-column: 1 / -1; height: 3px; background: #2a2a2a; border-radius: 2px; overflow: hidden; margin-top: 6px; }
    .job-fill { height: 100%; width: 0; background: #4a9eff; transition: width 0.15s; }
    .job[data-state="done"] .job-fill { background: #4ade80; }
    .job[data-state="error"] .job-fill { background: #e05252; }

    /* One upload: just its own card, no header. Several: header + counter + stack. */
    .tray.single .tray-head { display: none; }
    .tray.single .tray-list { display: block; border-top: none; }
    .tray-count {
      display: none; position: absolute; top: -9px; left: -9px; z-index: 2;
      min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px;
      background: #4a9eff; color: #07121f; font-size: 0.72rem; font-weight: 700;
      line-height: 22px; text-align: center; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }
    .tray.stacked .tray-count { display: block; }
    .job-pct { grid-column: 2; grid-row: 1 / span 2; font-size: 0.82rem; color: #888; font-variant-numeric: tabular-nums; }
    .job-pct[hidden] { display: none; }
    @media (max-width: 600px), (hover: none) {
      .tray { left: 50%; right: auto; transform: translateX(-50%); width: min(92vw, 360px); bottom: 14px; }
    }
  </style>
</head>
<body>
  <h1>TeleHost</h1>

  <div id="dropzone" tabindex="0" role="button" aria-label="Upload files">

    <!-- Idle state (default) -->
    <div id="state-idle" style="display:flex; flex-direction:column; align-items:center; gap:20px; width:100%;">
      <svg class="idle-icon" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="16 16 12 12 8 16"></polyline>
        <line x1="12" y1="12" x2="12" y2="21"></line>
        <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"></path>
      </svg>

      <div class="idle-text">
        <strong>Drag &amp; drop files or folders here</strong>
        click to browse &nbsp;·&nbsp; <button id="browseFolderBtn" type="button" class="inline-link">select folder</button>
      </div>

      <div class="opts" id="opts">
        <div class="opts-bar">
          <button id="optionsBtn" type="button" class="inline-link opts-toggle" aria-expanded="false" aria-controls="optionsPanel">Options</button>
          <span id="optionsSummary" class="opts-summary"></span>
        </div>
        <div id="optionsPanel" class="opts-panel" hidden>
          <div class="seg-ctrl" id="segCtrl">
            <button class="seg active" data-mode="compressed" type="button">Compressed</button>
            <button class="seg" data-mode="original" type="button">Original</button>
          </div>

          <div class="options">
            <label class="expiry" id="expiry">Link expires
              <select id="expirySel">
                <option value="">never</option>
                <option value="3600">in 1 hour</option>
                <option value="86400">in 1 day</option>
                <option value="604800">in 7 days</option>
                <option value="2592000">in 30 days</option>
              </select>
            </label>
            <input class="pw" id="passwordInput" type="password" placeholder="Password (optional)" autocomplete="new-password" aria-label="Password (optional)">
          </div>

          <p id="hint"></p>
        </div>
      </div>
    </div>

  </div>

  </div>

  <!-- Upload history (persisted in localStorage) -->
  <div id="history">
    <div class="history-header">
      <span id="historyTitle">History</span>
      <span class="history-actions">
        <button id="historyCopyAll" type="button">Copy all</button>
        <button id="historyClear" type="button" aria-label="Clear upload history" title="Clear history">&times;</button>
      </span>
    </div>
    <div id="historyList"></div>
  </div>

  <!-- Uploads in progress: a stack in the corner (centered on phones) -->
  <div id="tray" class="tray" hidden role="region" aria-label="Uploads">
    <div class="tray-card">
      <span id="trayCount" class="tray-count" aria-hidden="true"></span>
      <button id="trayHead" class="tray-head" type="button" aria-expanded="false" aria-controls="trayList">
        <span id="traySummary" class="tray-summary"></span>
        <span id="trayPct" class="tray-pct"></span>
        <span class="tray-total"><span id="trayFill"></span></span>
      </button>
      <div id="trayList" class="tray-list"></div>
    </div>
  </div>

  <input type="file" id="fileInput" multiple>
  <input type="file" id="folderInput" webkitdirectory>

  <script src="/settings.js"></script>
  <script>
    (function () {
      const dropzone      = document.getElementById('dropzone');
      const fileInput     = document.getElementById('fileInput');
      const folderInput   = document.getElementById('folderInput');
      const historyEl     = document.getElementById('history');
      const historyListEl = document.getElementById('historyList');
      const historyClear  = document.getElementById('historyClear');
      const hintEl        = document.getElementById('hint');
      const segCtrl       = document.getElementById('segCtrl');
      const expirySel     = document.getElementById('expirySel');
      const passwordInput = document.getElementById('passwordInput');
      const optionsBtn    = document.getElementById('optionsBtn');
      const optionsPanel  = document.getElementById('optionsPanel');
      const optionsSummary= document.getElementById('optionsSummary');

      // Telegram lets bots upload 50 MB but download only 20 MB, so bigger files
      // are split into parts this size and tied together by a small manifest file.
      const CHUNK_SIZE = 19 * 1024 * 1024;
      const MAX_FILE_SIZE = 1024 * 1024 * 1024; // 1 GB — the join page assembles in memory
      const PART_RETRIES = 3;

      const settings = THSettings.load(); // power-user options, see /settings

      const ZIP_SIZE_LIMIT = 45 * 1024 * 1024; // 45 MB — Telegram bot API limit is 50 MB

      const HINT_KEY  = 'th_hinted';
      const MODE_KEY  = 'th_mode';
      const HINTS = {
        compressed: 'Smaller file, slightly lower quality',
        original:   'Full quality, larger file',
      };

      let currentMode   = 'compressed';
      let hintsVisible  = !localStorage.getItem(HINT_KEY);
      let dragCounter   = 0;

      // ── Segmented control ──────────────────────────────────────────────
      function updateHint() {
        if (!hintsVisible) return;
        hintEl.textContent = HINTS[currentMode];
        hintEl.classList.remove('hidden');
      }

      segCtrl.addEventListener('click', function (e) {
        const btn = e.target.closest('.seg');
        if (!btn) return;
        segCtrl.querySelectorAll('.seg').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.dataset.mode;
        try { localStorage.setItem(MODE_KEY, currentMode); } catch (_) {}
        updateHint();
        updateOptionsSummary();
      });

      // ── Options panel ──────────────────────────────────────────────────
      optionsBtn.addEventListener('click', function () {
        const open = optionsPanel.hidden;
        optionsPanel.hidden = !open;
        optionsBtn.setAttribute('aria-expanded', String(open));
      });

      // One line next to the toggle so a non-default choice is never hidden.
      function updateOptionsSummary() {
        const bits = [];
        if (currentMode === 'original') bits.push('Original quality');
        if (expirySel.value) bits.push('Expires ' + expirySel.options[expirySel.selectedIndex].text);
        if (passwordInput.value) bits.push('Password');
        optionsSummary.textContent = bits.join(' \u00B7 ');
      }

      expirySel.addEventListener('change', updateOptionsSummary);
      passwordInput.addEventListener('input', updateOptionsSummary);

      // Expiry and password apply to one batch of uploads, never silently to the next.
      function resetOneShotOptions() {
        expirySel.value = '';
        passwordInput.value = '';
        updateOptionsSummary();
      }

      // Snapshot the options for the files being added, then reset the one-shot ones.
      function takeOptions() {
        const options = { mode: currentMode, expiresIn: expirySel.value, password: passwordInput.value };
        resetOneShotOptions();
        return options;
      }

      // Restore the remembered quality mode
      try {
        if (localStorage.getItem(MODE_KEY) === 'original') {
          currentMode = 'original';
          segCtrl.querySelectorAll('.seg').forEach(function (b) {
            b.classList.toggle('active', b.dataset.mode === 'original');
          });
          updateHint();
          updateOptionsSummary();
        }
      } catch (_) {}

      // Init hints
      if (hintsVisible) {
        updateHint();
      } else {
        hintEl.classList.add('hidden');
      }

      // ── Drag & drop ────────────────────────────────────────────────────
      document.body.addEventListener('dragenter', function (e) {
        e.preventDefault();
        dragCounter++;
        dropzone.classList.add('drag-over');
      });

      document.body.addEventListener('dragover', function (e) {
        e.preventDefault();
      });

      document.body.addEventListener('dragleave', function (e) {
        dragCounter--;
        if (dragCounter <= 0) {
          dragCounter = 0;
          dropzone.classList.remove('drag-over');
        }
      });

      document.body.addEventListener('drop', function (e) {
        e.preventDefault();
        dragCounter = 0;
        dropzone.classList.remove('drag-over');

        // Use the DataTransferItem entry API so we can detect and traverse folders.
        // webkitGetAsEntry() must be called synchronously inside the event handler.
        const items = e.dataTransfer.items ? Array.from(e.dataTransfer.items) : null;
        if (items) {
          const entries = items.map(i => i.webkitGetAsEntry()).filter(Boolean);
          if (entries.some(en => en.isDirectory)) {
            handleDroppedEntries(entries, takeOptions());
            return;
          }
        }
        const files = Array.from(e.dataTransfer.files);
        if (files.length) enqueue(files, takeOptions());
      });

      // ── Click to upload ────────────────────────────────────────────────
      dropzone.addEventListener('click', function (e) {
        if (e.target.closest('.opts')) return; // the options handle their own clicks
        fileInput.click();
      });

      dropzone.addEventListener('keydown', function (e) {
        if (e.target !== dropzone) return; // keys typed into the options must not open the picker
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          fileInput.click();
        }
      });

      fileInput.addEventListener('change', function () {
        const files = Array.from(fileInput.files);
        if (files.length) enqueue(files, takeOptions());
        fileInput.value = '';
      });

      // ── Folder picker ──────────────────────────────────────────────────
      document.getElementById('browseFolderBtn').addEventListener('click', function (e) {
        e.stopPropagation(); // don't trigger the dropzone click
        folderInput.click();
      });

      folderInput.addEventListener('change', function () {
        const files = Array.from(folderInput.files);
        folderInput.value = '';
        if (!files.length) return;
        // webkitRelativePath is "FolderName/subdir/file.ext" — group by top-level dir
        const byFolder = {};
        for (const file of files) {
          const topFolder = file.webkitRelativePath.split('/')[0];
          if (!byFolder[topFolder]) byFolder[topFolder] = [];
          byFolder[topFolder].push({ path: file.webkitRelativePath, file });
        }
        handleFolderGroups(byFolder, takeOptions());
      });

      // ── Paste ──────────────────────────────────────────────────────────
      document.addEventListener('paste', function (e) {
        if (!e.clipboardData) return;
        const items = Array.from(e.clipboardData.items).filter(i => i.kind === 'file');
        if (!items.length) return;
        e.preventDefault();
        const files = items.map(i => i.getAsFile()).filter(Boolean);
        if (files.length) enqueue(files, takeOptions());
      });

      // ── Upload tray ────────────────────────────────────────────────────
      const trayEl      = document.getElementById('tray');
      const trayHead    = document.getElementById('trayHead');
      const trayList    = document.getElementById('trayList');
      const traySummary = document.getElementById('traySummary');
      const trayPct     = document.getElementById('trayPct');
      const trayFill    = document.getElementById('trayFill');

      const jobs = [];      // everything shown in the tray
      const queue = [];     // jobs waiting for their turn
      let jobSeq = 0;

      const isActive = function (job) { return job.state === 'queued' || job.state === 'uploading' || job.state === 'prep'; };

      function cancelError() {
        const err = new Error('Cancelled');
        err.cancelled = true;
        return err;
      }

      function createJob(name, options) {
        const job = { id: ++jobSeq, name: name, opts: options || null, file: null, size: 0, state: 'queued',
                      pct: 0, label: 'Waiting', cancelled: false, abort: null, el: null };
        const row = document.createElement('div');
        row.className = 'job';
        const nameEl = document.createElement('div');
        nameEl.className = 'job-name';
        nameEl.textContent = name;
        nameEl.title = name;
        const labelEl = document.createElement('div');
        labelEl.className = 'job-label';
        const pctEl = document.createElement('div');
        pctEl.className = 'job-pct';
        const retry = document.createElement('button');
        retry.type = 'button';
        retry.className = 'job-retry';
        retry.textContent = 'Retry';
        const x = document.createElement('button');
        x.type = 'button';
        x.className = 'job-x';
        x.textContent = '\u00D7';
        const bar = document.createElement('div');
        bar.className = 'job-bar';
        bar.setAttribute('role', 'progressbar');
        bar.setAttribute('aria-valuemin', '0');
        bar.setAttribute('aria-valuemax', '100');
        bar.setAttribute('aria-label', 'Upload progress for ' + name);
        const fill = document.createElement('div');
        fill.className = 'job-fill';
        bar.appendChild(fill);
        row.append(nameEl, labelEl, pctEl, retry, x, bar);
        job.el = { row: row, label: labelEl, pct: pctEl, fill: fill, bar: bar, retry: retry, x: x };

        x.addEventListener('click', function () { cancelJob(job); });
        retry.addEventListener('click', function () {
          job.cancelled = false;
          setJob(job, { state: 'queued', label: 'Waiting', pct: 0 });
          queue.push(job);
          pump();
        });

        trayList.appendChild(row);
        jobs.push(job);
        paintRow(job);
        updateTray();
        return job;
      }

      function paintRow(job) {
        const el = job.el;
        el.label.textContent = job.label;
        el.row.dataset.state = job.state;
        el.fill.style.width = job.pct + '%';
        el.pct.hidden = job.state !== 'uploading';
        el.pct.textContent = job.pct + '%';
        el.bar.setAttribute('aria-valuenow', String(job.pct));
        el.retry.hidden = !(job.state === 'error' && job.file);
        el.x.hidden = job.state === 'done';
        const verb = job.state === 'error' ? 'Dismiss ' : 'Cancel ';
        el.x.setAttribute('aria-label', verb + job.name);
        el.x.title = verb.trim();
      }

      function setJob(job, patch) {
        Object.assign(job, patch);
        paintRow(job);
        updateTray();
      }

      function removeJob(job) {
        const index = jobs.indexOf(job);
        if (index < 0) return;
        jobs.splice(index, 1);
        job.el.row.remove();
        updateTray();
      }

      function cancelJob(job) {
        if (job.state === 'error') return removeJob(job);
        job.cancelled = true;
        if (job.state === 'uploading' && job.abort) job.abort();
        // Waiting and preparing jobs have nothing in flight; an uploading job is
        // removed by runJob once the abort lands.
        if (job.state !== 'uploading') removeJob(job);
      }

      function updateTray() {
        trayEl.hidden = jobs.length === 0;
        trayEl.classList.toggle('stacked', jobs.length > 1);
        trayEl.classList.toggle('single', jobs.length === 1);
        document.getElementById('trayCount').textContent = String(jobs.length);
        const active = jobs.filter(isActive);
        const failed = jobs.filter(function (j) { return j.state === 'error'; });
        const weight = function (j) { return j.size || 1; };
        const totalWeight = active.reduce(function (sum, j) { return sum + weight(j); }, 0);
        const pct = totalWeight
          ? Math.round(active.reduce(function (sum, j) { return sum + j.pct * weight(j); }, 0) / totalWeight)
          : 100;
        if (jobs.length === 1) {
          traySummary.textContent = jobs[0].name;
          trayPct.textContent = '';
        } else if (active.length) {
          traySummary.textContent = active.length + ' uploads' + (failed.length ? ' · ' + failed.length + ' failed' : '');
          trayPct.textContent = pct + '%';
        } else {
          traySummary.textContent = failed.length ? failed.length + ' failed' : 'Done';
          trayPct.textContent = '';
        }
        trayFill.style.width = pct + '%';
      }

      // Touch screens have no hover, so the header toggles the list.
      trayHead.addEventListener('click', function () {
        const open = trayEl.classList.toggle('open');
        trayHead.setAttribute('aria-expanded', String(open));
      });

      window.addEventListener('beforeunload', function (e) {
        if (jobs.some(isActive)) {
          e.preventDefault();
          e.returnValue = '';
        }
      });

      // ── Upload queue ───────────────────────────────────────────────────
      function enqueue(files, options) {
        files.forEach(function (file) {
          const job = createJob(file.name, options);
          job.file = file;
          job.size = file.size;
          queue.push(job);
        });
        pump();
      }

      // Two at a time by default: more hits Telegram's per-chat message limit sooner.
      const UPLOAD_CONCURRENCY = settings.concurrency;
      let running = 0;

      function pump() {
        while (running < UPLOAD_CONCURRENCY && queue.length) {
          const job = queue.shift();
          if (job.cancelled || jobs.indexOf(job) < 0) continue;
          running++;
          runJob(job).finally(function () {
            running--;
            pump();
          });
        }
      }

      async function runJob(job) {
        setJob(job, { state: 'uploading', label: 'Starting…' });
        try {
          const result = await uploadOne(job);
          setJob(job, { state: 'done', pct: 100, label: 'Done' });
          dismissHints();
          finishLink(result); // shortens in the background
          setTimeout(function () { removeJob(job); }, 1500);
        } catch (err) {
          if (job.cancelled || err.cancelled) return removeJob(job);
          const message = err instanceof TypeError ? 'Network error — check your connection.' : err.message;
          setJob(job, { state: 'error', label: message });
        }
      }

      function dismissHints() {
        if (!hintsVisible) return;
        hintsVisible = false;
        try { localStorage.setItem(HINT_KEY, '1'); } catch (_) {}
        hintEl.classList.add('hidden');
      }

      // XMLHttpRequest rather than fetch: only it reports upload progress.
      function postFile(file, mode, fields, job, onProgress) {
        return new Promise(function (resolve, reject) {
          const fd = new FormData();
          fd.append('file', file);
          fd.append('compressionMode', mode);
          Object.keys(fields || {}).forEach(function (k) {
            if (fields[k] instanceof Blob) fd.append(k, fields[k], 'thumb.jpg');
            else fd.append(k, fields[k]);
          });
          const xhr = new XMLHttpRequest();
          xhr.open('POST', '/upload');
          xhr.upload.onprogress = function (e) {
            if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total);
          };
          xhr.upload.onload = function () { if (onProgress) onProgress(1); };
          xhr.onload = function () {
            let data = null;
            try { data = JSON.parse(xhr.responseText); } catch (_) {}
            if (xhr.status === 429) {
              const busy = new Error('Telegram is busy');
              busy.retryAfter = Number(xhr.getResponseHeader('Retry-After')) || (data && data.retryAfter) || 5;
              return reject(busy);
            }
            if (xhr.status < 200 || xhr.status >= 300) {
              return reject(new Error((data && data.error) ? data.error : 'Server error (' + xhr.status + ')'));
            }
            if (!Array.isArray(data) || !data[0] || !data[0].src) return reject(new Error('Unexpected server response'));
            resolve(data[0]);
          };
          xhr.onerror = function () { reject(new TypeError('Network error')); };
          xhr.onabort = function () { reject(cancelError()); };
          job.abort = function () { xhr.abort(); };
          xhr.send(fd);
        });
      }

      // Telegram rate limits arrive as 429 + Retry-After: wait that long (counting
      // down in the tray) without using up a normal retry, up to a sane cap.
      async function waitWhileBusy(job, seconds) {
        for (let left = seconds; left > 0; left--) {
          if (job.cancelled) throw cancelError();
          setJob(job, { label: 'Telegram is busy — retrying in ' + left + 's' });
          await new Promise(function (r) { setTimeout(r, 1000); });
        }
        if (job.cancelled) throw cancelError();
      }

      async function postWithRetry(file, mode, fields, job, onProgress) {
        const MAX_BUSY_WAITS = 10;
        let attempts = 0, busyWaits = 0, lastErr;
        while (attempts < PART_RETRIES) {
          if (job.cancelled) throw cancelError();
          try {
            return await postFile(file, mode, fields, job, onProgress);
          } catch (err) {
            if (err.cancelled) throw err;
            if (err.retryAfter && busyWaits < MAX_BUSY_WAITS) {
              busyWaits++;
              await waitWhileBusy(job, Math.min(err.retryAfter, 60));
              continue;
            }
            lastErr = err;
            attempts++;
            if (attempts < PART_RETRIES) await new Promise(function (r) { setTimeout(r, 1000 * attempts); });
          }
        }
        throw lastErr;
      }

      // Parts that already reached Telegram are remembered in localStorage, keyed
      // by file identity, so re-selecting the same file after a failure resumes
      // instead of starting over. The server keeps no state for this.
      const RESUME_PREFIX = 'th_resume:';
      const RESUME_TTL = 7 * 24 * 60 * 60 * 1000;

      function resumeKeyFor(file) {
        return RESUME_PREFIX + [file.name, file.size, file.lastModified, CHUNK_SIZE].join(':');
      }

      function loadResume(key, total, fileSize) {
        try {
          const saved = JSON.parse(localStorage.getItem(key) || 'null');
          if (!saved || Date.now() - saved.ts > RESUME_TTL || !Array.isArray(saved.parts)) return [];
          const parts = [];
          for (let i = 0; i < saved.parts.length && i < total; i++) {
            const p = saved.parts[i];
            const expected = Math.min(CHUNK_SIZE, fileSize - i * CHUNK_SIZE);
            if (!p || p.size !== expected || !/^\/file\/[A-Za-z0-9_.\-]+$/.test(p.src)) break;
            parts.push({ src: p.src, size: p.size });
          }
          return parts;
        } catch (_) {
          return [];
        }
      }

      function saveResume(key, parts) {
        try { localStorage.setItem(key, JSON.stringify({ ts: Date.now(), parts: parts })); } catch (_) { /* no resume without storage */ }
      }

      function clearResume(key) {
        try { localStorage.removeItem(key); } catch (_) {}
      }

      // Split a big file into parts, upload each as a document, then upload a
      // manifest listing them. The manifest's /join link is what the user shares.
      async function uploadChunked(job) {
        const file = job.file;
        const total = Math.ceil(file.size / CHUNK_SIZE);
        const pad = String(total).length;
        const resumeKey = resumeKeyFor(file);
        const parts = loadResume(resumeKey, total, file.size);
        const resumed = parts.length > 0;
        let sentBytes = parts.reduce(function (sum, p) { return sum + p.size; }, 0);
        setJob(job, { pct: Math.round(sentBytes / file.size * 100) });
        for (let i = parts.length; i < total; i++) {
          setJob(job, { label: 'Part ' + (i + 1) + ' of ' + total + (resumed ? ' · resumed' : '') });
          const slice = file.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
          const label = String(i + 1).padStart(pad, '0');
          const partFile = new File([slice], file.name + '.part' + label, { type: 'application/octet-stream' });
          const item = await postWithRetry(partFile, 'original', null, job, function (fraction) {
            setJob(job, { pct: Math.round((sentBytes + fraction * slice.size) / file.size * 100) });
          });
          sentBytes += slice.size;
          parts.push({ src: item.src, size: slice.size });
          saveResume(resumeKey, parts);
        }
        setJob(job, { label: 'Finishing…', pct: 100 });
        const manifest = { v: 1, name: file.name, size: file.size, type: file.type || '', parts: parts };
        const manifestFile = new File([JSON.stringify(manifest)], file.name + '.manifest.json', { type: 'application/json' });
        const item = await postWithRetry(manifestFile, 'original', null, job);
        clearResume(resumeKey);
        return '/join/' + item.src.replace('/file/', '');
      }

      // Password-protected uploads are encrypted here, so Telegram and the server
      // only ever see ciphertext. The unlock page uses the same parameters.
      const PBKDF2_ITER = 600000;

      function toBase64Url(bytes) {
        let bin = '';
        bytes.forEach(function (b) { bin += String.fromCharCode(b); });
        return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }

      async function deriveAesKey(password, salt, usages) {
        if (!(window.crypto && crypto.subtle)) throw new Error('Password protection needs a secure (https) connection.');
        const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: salt, iterations: PBKDF2_ITER, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, usages);
      }

      async function encryptFile(file, password) {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const key = await deriveAesKey(password, salt, ['encrypt']);
        const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, await file.arrayBuffer());
        return {
          file: new File([cipher], 'encrypted.bin', { type: 'application/octet-stream' }),
          fields: {
            encSalt: toBase64Url(salt), encIv: toBase64Url(iv), encIter: PBKDF2_ITER,
            encName: file.name, encType: file.type || '', encSize: file.size,
          },
        };
      }

      // For big files: one key for the whole file, one IV per part (an 8-byte random
      // prefix plus the part number), so no IV is ever reused under the same key.
      async function makePartEncryptor(password) {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const ivPrefix = crypto.getRandomValues(new Uint8Array(8));
        const key = await deriveAesKey(password, salt, ['encrypt']);
        return {
          params: { salt: toBase64Url(salt), ivp: toBase64Url(ivPrefix), iter: PBKDF2_ITER },
          encrypt: function (buffer, index) {
            const iv = new Uint8Array(12);
            iv.set(ivPrefix);
            new DataView(iv.buffer).setUint32(8, index);
            return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, buffer);
          },
        };
      }

      // Grab a frame about a second in (the first frame is often black) as a
      // small JPEG for link previews. Best effort: resolves null on any failure,
      // and the server then falls back to Telegram's own thumbnail.
      function captureThumbnail(file) {
        return new Promise(function (resolve) {
          const video = document.createElement('video');
          const url = URL.createObjectURL(file);
          let finished = false;
          const timer = setTimeout(function () { finish(null); }, 8000);

          function finish(blob) {
            if (finished) return;
            finished = true;
            clearTimeout(timer);
            URL.revokeObjectURL(url);
            video.removeAttribute('src');
            resolve(blob);
          }

          video.muted = true;
          video.playsInline = true;
          video.preload = 'metadata';
          video.onerror = function () { finish(null); };
          video.onloadedmetadata = function () {
            video.currentTime = Math.min(1, (video.duration || 2) / 2);
          };
          video.onseeked = function () {
            try {
              const w = video.videoWidth, h = video.videoHeight;
              if (!w || !h) return finish(null);
              const scale = Math.min(1, 320 / Math.max(w, h)); // Telegram caps thumbnails at 320px
              const canvas = document.createElement('canvas');
              canvas.width = Math.round(w * scale);
              canvas.height = Math.round(h * scale);
              canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
              canvas.toBlob(function (blob) {
                finish(blob && blob.size <= 200 * 1024 ? blob : null); // Telegram: under 200 kB
              }, 'image/jpeg', 0.8);
            } catch (_) {
              finish(null);
            }
          };
          video.src = url;
        });
      }

      // A big file with an expiry and/or a password: parts go up as usual (each
      // answered with a signed receipt, encrypted first if there is a password), then
      // /finalize turns the receipts into one signed /s/ link. No resume yet: the
      // parts are only usable together with the key parameters chosen here.
      async function uploadChunkedSecure(job) {
        const file = job.file;
        const options = job.opts;
        const total = Math.ceil(file.size / CHUNK_SIZE);
        const pad = String(total).length;
        let encryptor = null;
        if (options.password) {
          setJob(job, { label: 'Encrypting…' });
          encryptor = await makePartEncryptor(options.password);
        }
        const receipts = [];
        let sentBytes = 0;
        for (let i = 0; i < total; i++) {
          setJob(job, { label: 'Part ' + (i + 1) + ' of ' + total });
          const slice = file.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
          const label = String(i + 1).padStart(pad, '0');
          // Encrypted parts carry no file name into the channel.
          const body = encryptor ? new Blob([await encryptor.encrypt(await slice.arrayBuffer(), i)]) : slice;
          const partFile = new File([body], encryptor ? 'part' + label + '.bin' : file.name + '.part' + label,
                                    { type: 'application/octet-stream' });
          const item = await postWithRetry(partFile, 'original', { part: '1' }, job, function (fraction) {
            setJob(job, { pct: Math.round((sentBytes + fraction * slice.size) / file.size * 100) });
          });
          if (!item.receipt) throw new Error('Unexpected server response');
          receipts.push(item.receipt);
          sentBytes += slice.size;
        }
        setJob(job, { label: 'Finishing…', pct: 100 });
        const payload = { receipts: receipts, name: file.name, type: file.type || '', size: file.size };
        if (options.expiresIn) payload.expiresIn = options.expiresIn;
        if (encryptor) payload.enc = encryptor.params;
        return (await finalizeParts(job, payload)).src;
      }

      async function finalizeParts(job, payload) {
        let failures = 0, busyWaits = 0;
        for (;;) {
          if (job.cancelled) throw cancelError();
          let res;
          try {
            res = await fetch('/finalize', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            });
          } catch (err) {
            if (++failures >= PART_RETRIES) throw err;
            await new Promise(function (r) { setTimeout(r, 1000 * failures); });
            continue;
          }
          if (res.status === 429 && busyWaits++ < 10) {
            await waitWhileBusy(job, Math.min(Number(res.headers.get('Retry-After')) || 5, 60));
            continue;
          }
          const data = await res.json().catch(function () { return null; });
          if (!res.ok) throw new Error((data && data.error) ? data.error : 'Server error (' + res.status + ')');
          if (!Array.isArray(data) || !data[0] || !data[0].src) throw new Error('Unexpected server response');
          return data[0];
        }
      }

      // Uploads one job and resolves { url, note }.
      async function uploadOne(job) {
        const file = job.file;
        const options = job.opts;

        if (file.size > MAX_FILE_SIZE) throw new Error('File is too large (max 1 GB).');

        if (file.size > CHUNK_SIZE) {
          const secure = options.expiresIn || options.password;
          const link = secure ? await uploadChunkedSecure(job) : await uploadChunked(job);
          return { url: window.location.origin + link, note: '' };
        }

        let toSend = file;
        const fields = {};
        if (options.expiresIn) fields.expiresIn = options.expiresIn;
        if (options.password) {
          setJob(job, { label: 'Encrypting…' });
          const encrypted = await encryptFile(file, options.password);
          toSend = encrypted.file;
          Object.assign(fields, encrypted.fields);
        } else if (file.type.indexOf('video/') === 0) {
          setJob(job, { label: 'Preparing…' });
          const thumbnail = await captureThumbnail(file);
          if (thumbnail) fields.thumbnail = thumbnail;
        }
        if (job.cancelled) throw cancelError();

        const item = await postWithRetry(toSend, options.mode, fields, job, function (fraction) {
          const pct = Math.round(fraction * 100);
          setJob(job, { pct: pct, label: fraction >= 1 ? 'Processing…' : 'Uploading…' });
        });
        return {
          url: window.location.origin + item.src,
          note: item.fallback ? 'Stored as original — compressed upload not supported for this file' : '',
        };
      }

      // The link goes into the history right away; the short version replaces it
      // once a shortener answers (or stays as is if none does).
      async function finishLink(result) {
        saveToHistory(result.url, result.note);
        renderHistory(result.url);
        const short = await shortenUrl(result.url);
        if (short !== result.url) {
          replaceInHistory(result.url, short);
          renderHistory();
        }
      }

      // ── URL shortener ──────────────────────────────────────────────────
      async function shortenUrl(url) {
        if (!url || settings.shortener === 'none') return url;

        const encoded = encodeURIComponent(url);
        const ask = (endpoint) => () =>
          fetch(endpoint, { signal: AbortSignal.timeout(4000) }).then(r => r.text());
        const dagd    = ask('https://da.gd/shorten?url=' + encoded);
        const tinyurl = ask('https://tinyurl.com/api-create.php?url=' + encoded);
        const services = {
          auto:    [dagd, tinyurl],
          dagd:    [dagd],
          tinyurl: [tinyurl],
          custom:  [ask(settings.customShortener.split('{url}').join(encoded))],
        }[settings.shortener] || [dagd, tinyurl];

        for (const call of services) {
          try {
            const short = (await call()).trim();
            if (/^https?:\/\/\S+$/.test(short)) return short;
          } catch (_) {
            // try next service
          }
        }

        return url; // all services failed — fall back to original
      }

      // ── Copy button ────────────────────────────────────────────────────
      function makeCopyButton(getUrl) {
        const btn = document.createElement('button');
        btn.className   = 'copy-btn';
        btn.type        = 'button';
        btn.textContent = 'Copy';

        function flash() {
          btn.textContent = 'Copied!';
          btn.classList.add('copied');
          setTimeout(function () {
            btn.textContent = 'Copy';
            btn.classList.remove('copied');
          }, 2000);
        }

        btn.addEventListener('click', function () {
          navigator.clipboard.writeText(getUrl()).then(flash).catch(function () {
            // Fallback for browsers without clipboard API
            const ta = document.createElement('textarea');
            ta.value = getUrl();
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            flash();
          });
        });

        return btn;
      }

      // ── Copy as Markdown / HTML / BBCode ───────────────────────────────
      // Images embed, everything else becomes a link; quotes and angle brackets are
      // escaped so an odd URL cannot break out of the snippet.
      function copyFormats(url) {
        let pathname = '';
        try { pathname = new URL(url).pathname; } catch (_) {}
        const u = url.replace(/["<>]/g, encodeURIComponent);
        return /\.(png|jpe?g|gif|webp|avif|apng|bmp)$/i.test(pathname)
          ? [['Markdown', '![](' + u + ')'], ['HTML', '<img src="' + u + '">'], ['BBCode', '[img]' + u + '[/img]']]
          : [['Markdown', '[' + u + '](' + u + ')'], ['HTML', '<a href="' + u + '">' + u + '</a>'], ['BBCode', '[url]' + u + '[/url]']];
      }

      function copyText(text) {
        return navigator.clipboard.writeText(text).catch(function () {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        });
      }

      function makeFormatMenu(url) {
        const menu = document.createElement('details');
        menu.className = 'more';
        const summary = document.createElement('summary');
        summary.textContent = '\u25BE';
        summary.title = 'Copy as…';
        summary.setAttribute('aria-label', 'Copy as…');
        const list = document.createElement('div');
        list.className = 'more-menu';
        copyFormats(url).forEach(function (format) {
          const item = document.createElement('button');
          item.type = 'button';
          item.textContent = format[0];
          item.addEventListener('click', function () {
            copyText(format[1]).then(function () {
              item.textContent = 'Copied!';
              setTimeout(function () { item.textContent = format[0]; menu.open = false; }, 700);
            });
          });
          list.appendChild(item);
        });
        menu.append(summary, list);
        return menu;
      }

      document.addEventListener('click', function (e) {
        document.querySelectorAll('details.more[open]').forEach(function (d) {
          if (!d.contains(e.target)) d.open = false;
        });
      });

      // ── Upload history (localStorage) ──────────────────────────────────
      const HISTORY_KEY = 'th_history';
      // With history off (0) nothing is persisted: links stay in this list until
      // the page closes, so a finished upload is never lost from view.
      const SESSION_ONLY = settings.historyMax === 0;
      const HISTORY_MAX = SESSION_ONLY ? 500 : settings.historyMax;
      let sessionHistory = [];

      function loadHistory() {
        if (SESSION_ONLY) return sessionHistory.slice();
        try {
          const list = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
          return Array.isArray(list) ? list : [];
        } catch (_) {
          return [];
        }
      }

      function writeHistory(list) {
        if (SESSION_ONLY) {
          sessionHistory = list.slice(0, HISTORY_MAX);
          return;
        }
        try {
          localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, HISTORY_MAX)));
        } catch (_) { /* storage unavailable — history just won't persist */ }
      }

      function saveToHistory(url, note) {
        const list = loadHistory().filter(function (e) { return e.url !== url; });
        list.unshift({ url: url, ts: Date.now(), note: note || '' });
        writeHistory(list);
      }

      function replaceInHistory(oldUrl, newUrl) {
        const list = loadHistory();
        const entry = list.find(function (e) { return e.url === oldUrl; });
        if (!entry) return;
        entry.url = newUrl;
        writeHistory(list.filter(function (e, i) { return e === entry || e.url !== newUrl || i === list.indexOf(entry); }));
      }

      function renderHistory(freshUrl) {
        const list = loadHistory();
        historyListEl.textContent = '';
        historyEl.classList.toggle('visible', list.length > 0);

        list.forEach(function (entry) {
          const item = document.createElement('div');
          item.className = 'result-item' + (entry.url === freshUrl ? ' fresh' : '');

          const wrap = document.createElement('div');
          wrap.className = 'result-url-wrap';

          const link = document.createElement('a');
          link.className   = 'result-url';
          link.href        = entry.url;
          link.target      = '_blank';
          link.rel         = 'noopener noreferrer';
          link.textContent = entry.url;
          link.title       = entry.url;
          wrap.appendChild(link);

          if (entry.note) {
            const note = document.createElement('span');
            note.className   = 'result-note';
            note.textContent = entry.note;
            wrap.appendChild(note);
          }

          item.appendChild(wrap);
          item.appendChild(makeCopyButton(function () { return entry.url; }));
          item.appendChild(makeFormatMenu(entry.url));
          historyListEl.appendChild(item);
        });
      }

      document.getElementById('historyCopyAll').addEventListener('click', function (e) {
        const btn = e.currentTarget;
        const text = loadHistory().map(function (entry) { return entry.url; }).join('\n');
        if (!text) return;
        const done = function () {
          btn.textContent = 'Copied!';
          setTimeout(function () { btn.textContent = 'Copy all'; }, 2000);
        };
        navigator.clipboard.writeText(text).then(done).catch(function () {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          done();
        });
      });

      historyClear.addEventListener('click', function () {
        sessionHistory = [];
        try { localStorage.removeItem(HISTORY_KEY); } catch (_) {}
        renderHistory();
      });

      if (SESSION_ONLY) document.getElementById('historyTitle').textContent = 'This session';
      renderHistory();
      // ── Folder drop (entry API) ────────────────────────────────────────
      // A folder becomes one zip. While it is read and zipped it shows in the tray.
      function startPrep(name, label) {
        const job = createJob(name, null);
        setJob(job, { state: 'prep', label: label });
        return job;
      }

      async function handleDroppedEntries(entries, options) {
        const filesToUpload = [];

        for (const entry of entries) {
          if (entry.isDirectory) {
            const prep = startPrep(entry.name, 'Reading folder…');
            try {
              const collected = [];
              await collectEntries(entry, '', collected);
              const totalSize = collected.reduce(function (s, e) { return s + e.file.size; }, 0);
              if (!collected.length || prep.cancelled) {
                removeJob(prep);
              } else if (totalSize <= ZIP_SIZE_LIMIT) {
                setJob(prep, { label: 'Zipping…' });
                const zipFile = await makeZip(collected, entry.name);
                removeJob(prep);
                if (!prep.cancelled) filesToUpload.push(zipFile);
              } else {
                // Folder too large to zip — upload files individually
                removeJob(prep);
                filesToUpload.push.apply(filesToUpload, collected.map(function (e) { return e.file; }));
              }
            } catch (_) {
              setJob(prep, { state: 'error', label: 'Could not read this folder.' });
            }
          } else {
            // Regular file inside a mixed drop
            const file = await new Promise(function (res, rej) { entry.file(res, rej); });
            filesToUpload.push(file);
          }
        }

        if (filesToUpload.length) enqueue(filesToUpload, options);
      }

      // Group entries from a webkitdirectory input and zip each folder
      async function handleFolderGroups(byFolder, options) {
        const filesToUpload = [];

        for (const folderName of Object.keys(byFolder)) {
          const entries = byFolder[folderName];
          const totalSize = entries.reduce(function (s, e) { return s + e.file.size; }, 0);
          if (totalSize <= ZIP_SIZE_LIMIT) {
            const prep = startPrep(folderName, 'Zipping…');
            try {
              const zipFile = await makeZip(entries, folderName);
              removeJob(prep);
              if (!prep.cancelled) filesToUpload.push(zipFile);
            } catch (_) {
              setJob(prep, { state: 'error', label: 'Could not zip this folder.' });
            }
          } else {
            filesToUpload.push.apply(filesToUpload, entries.map(function (e) { return e.file; }));
          }
        }

        if (filesToUpload.length) enqueue(filesToUpload, options);
      }

      // Recursively collect { path, file } from a FileSystemEntry
      async function collectEntries(entry, prefix, result) {
        if (entry.isFile) {
          const file = await new Promise(function (res, rej) { entry.file(res, rej); });
          result.push({ path: prefix + entry.name, file: file });
        } else if (entry.isDirectory) {
          const reader = entry.createReader();
          const children = await readAllDirEntries(reader);
          for (const child of children) {
            await collectEntries(child, prefix + entry.name + '/', result);
          }
        }
      }

      // reader.readEntries() returns batches of ≤100; loop until empty
      function readAllDirEntries(reader) {
        return new Promise(function (resolve, reject) {
          var all = [];
          function batch() {
            reader.readEntries(function (entries) {
              if (!entries.length) return resolve(all);
              all.push.apply(all, entries);
              batch();
            }, reject);
          }
          batch();
        });
      }

      // Create a zip File from { path, file }[] entries
      async function makeZip(entries, folderName) {
        if (typeof JSZip === 'undefined') {
          await new Promise(function (res, rej) {
            var s = document.createElement('script');
            s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
            s.integrity = 'sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg==';
            s.crossOrigin = 'anonymous';
            s.onload = res; s.onerror = rej;
            document.head.appendChild(s);
          });
        }
        var zip = new JSZip();
        for (var i = 0; i < entries.length; i++) {
          zip.file(entries[i].path, entries[i].file);
        }
        var blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
        return new File([blob], folderName + '.zip', { type: 'application/zip' });
      }


      // ── Android share target ───────────────────────────────────────────
      // The installed app appears in the share sheet; sw.js parks the shared files
      // in a cache and redirects here with ?shared=<count>. Because any website
      // could POST files to that address, nothing is uploaded without asking.
      async function takeSharedFiles() {
        const flag = new URLSearchParams(location.search).get('shared');
        if (flag === null) return;
        history.replaceState(null, '', location.pathname);

        const problem = function (message) {
          const job = createJob('Shared files', null);
          setJob(job, { state: 'error', label: message });
        };
        if (flag === 'unavailable') return problem('Sharing is ready after the app has been opened once. Please share again.');
        if (flag === 'error' || !('caches' in window)) return problem('Could not receive the shared files.');

        const files = [];
        try {
          const cache = await caches.open('th-shared');
          for (const request of await cache.keys()) {
            const response = await cache.match(request);
            const blob = await response.blob();
            const name = decodeURIComponent(response.headers.get('X-File-Name') || 'shared-file');
            files.push(new File([blob], name, { type: blob.type }));
            await cache.delete(request);
          }
        } catch (_) {
          return problem('Could not receive the shared files.');
        }
        if (!files.length) return;

        // Names come from whoever posted the files, so flatten control characters
        // (no forged lines in the dialog) and cap the length.
        const plain = function (name) { return name.replace(/[\u0000-\u001f\u007f-\u009f\u2028\u2029]+/g, ' ').slice(0, 60); };
        const size = function (n) { return n < 1048576 ? Math.max(1, Math.round(n / 1024)) + ' KB' : (n / 1048576).toFixed(1) + ' MB'; };
        const listing = files.slice(0, 5).map(function (f) { return '\u2022 ' + plain(f.name) + ' (' + size(f.size) + ')'; }).join('\n');
        const more = files.length > 5 ? '\n\u2026and ' + (files.length - 5) + ' more' : '';
        if (window.confirm('Upload ' + files.length + ' shared file' + (files.length === 1 ? '' : 's') + '?\n\n' + listing + more)) {
          enqueue(files, takeOptions());
        }
      }

      takeSharedFiles();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(function () { /* sharing just won't be offered */ });
      }

    })();
  </script>
</body>
</html>
